[project]
name = "insurenceprediction-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "piyushsh19", email = "piyush.sh19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
insurenceprediction-model = "insurenceprediction_model:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
